name: Build HASHIM Nursing V10.8 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HASHIM_Nursing_V10_8_Firebase_API_Key_Fix.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build HASHIM Nursing V10.8
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q HASHIM_Nursing_V10_8_Firebase_API_Key_Fix.zip -d project

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/android-app
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HASHIM-Nursing-V10.8-APK
          path: project/android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
