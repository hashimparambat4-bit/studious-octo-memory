name: Build HASHIM Nursing APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HASHIM_Nursing_V10_5_Firebase_Connected.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build HASHIM Nursing V10.5
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q HASHIM_Nursing_V10_5_Firebase_Connected.zip -d project

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/android-app
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.9-all.zip/' gradle/wrapper/gradle-wrapper.properties
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HASHIM-Nursing-V10.5-Firebase-APK
          path: project/android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
