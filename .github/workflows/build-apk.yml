name: Build HASHIM Nursing APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'HASHIM_Nursing_V10_5_Achievements_Medal_Icon.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build HASHIM Nursing V10.5
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract HASHIM Nursing V10.5
        run: |
          unzip -q HASHIM_Nursing_V10_5_Achievements_Medal_Icon.zip -d project

      - name: Build APK
        working-directory: project/android-app
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HASHIM-Nursing-V10.5-APK
          path: project/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
