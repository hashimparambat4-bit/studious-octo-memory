name: HASHIM Nursing Public Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HASHIM_Nursing_V10_9_Public_Release_Setup.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q HASHIM_Nursing_V10_9_Public_Release_Setup.zip -d project

      - name: Convert PKCS12 to JKS
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OLD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OLD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEW_PASSWORD: ${{ secrets.ANDROID_JKS_PASSWORD }}
        run: |
          set -e

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/original.p12"

          keytool -importkeystore \
            -srckeystore "$RUNNER_TEMP/original.p12" \
            -srcstoretype PKCS12 \
            -srcstorepass "$OLD_STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$OLD_KEY_PASSWORD" \
            -destkeystore "$RUNNER_TEMP/release.jks" \
            -deststoretype JKS \
            -deststorepass "$NEW_PASSWORD" \
            -destkeypass "$NEW_PASSWORD" \
            -destalias "$KEY_ALIAS" \
            -noprompt

          rm "$RUNNER_TEMP/original.p12"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed Release APK
        working-directory: project/android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_JKS_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_JKS_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HASHIM-Nursing-Public-Release-10.9.1
          path: project/android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
