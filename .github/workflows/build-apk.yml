name: Build HASHIM Nursing APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HASHIM_Nursing_V10_5_Firebase_Connected.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build HASHIM Nursing V10.5
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q HASHIM_Nursing_V10_5_Firebase_Connected.zip -d project
          find project -maxdepth 5 -type f | head -100

      - name: Locate Android project
        run: |
          DIR=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)

          if [ -z "$DIR" ]; then
            echo "ERROR: No Gradle settings file found."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$DIR")
          echo "ANDROID_DIR=$ANDROID_DIR" >> $GITHUB_ENV

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug
          else
            gradle clean assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HASHIM-Nursing-V10.5-Firebase-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
