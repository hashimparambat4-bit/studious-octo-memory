name: Build HASHIM Nursing APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HASHIM_Nursing_V10_4_Learning_Features.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract HASHIM Nursing
        run: |
          unzip -q HASHIM_Nursing_V10_4_Learning_Features.zip -d project

      - name: Build APK
        working-directory: project/android-app
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HASHIM-Nursing-V10.4-APK
          path: project/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
